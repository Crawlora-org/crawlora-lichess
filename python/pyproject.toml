[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-lichess"
version = "0.1.0"
description = "Crawlora Lichess API client with 11 endpoints for puzzles, tablebases, tournaments, cloud evaluations, and public event listings"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "lichess", "lichess-api", "lichess-scraper", "lichess-data", "lichess-puzzles", "lichess-tablebases", "lichess-tournaments", "lichess-cloud-evaluations", "lichess-public-event-listings"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=lichess-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=lichess-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-lichess"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_lichess"]

[tool.setuptools.package-data]
"crawlora_lichess" = ["py.typed", "*.pyi"]
